
---
- name: Install Nginx
  ansible.builtin.dnf:
    name: nginx
    state: present

- name: Deploy Nginx reverse proxy configuration
  ansible.builtin.template:
    src: node_app.conf.j2
    dest: /etc/nginx/conf.d/node_app.conf
    owner: root
    group: root
    mode: "0644"
  notify: Validate and reload Nginx

- name: Remove default Nginx virtual host if present
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: Validate and reload Nginx

- name: Validate Nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Enable and start Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
