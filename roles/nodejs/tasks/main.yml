
---
- name: Ensure curl is installed
  ansible.builtin.dnf:
    name: curl
    state: present

- name: Download NodeSource setup script
  ansible.builtin.get_url:
    url: "https://rpm.nodesource.com/setup_{{ node_version }}.x"
    dest: /tmp/nodesource_setup.sh
    mode: "0750"

- name: Run NodeSource repository setup script
  ansible.builtin.command:
    cmd: /tmp/nodesource_setup.sh
    creates: /etc/yum.repos.d/nodesource-nodistro.repo

- name: Clean DNF metadata
  ansible.builtin.command:
    cmd: dnf clean all
  changed_when: false

- name: Disable default Node.js module stream
  ansible.builtin.command:
    cmd: dnf -y module disable nodejs
  register: nodejs_module_disable
  changed_when: "'Disabling modules' in (nodejs_module_disable.stdout | default(''))"
  failed_when: false

- name: Install Node.js package
  ansible.builtin.dnf:
    name: nodejs
    state: present
    update_cache: true

- name: Verify Node.js version
  ansible.builtin.command:
    cmd: node --version
  register: nodejs_version_result
  changed_when: false

- name: Display Node.js version
  ansible.builtin.debug:
    msg: "Installed Node.js version: {{ nodejs_version_result.stdout }}"

- name: Remove NodeSource setup script
  ansible.builtin.file:
    path: /tmp/nodesource_setup.sh
    state: absent
